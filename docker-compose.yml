services:
  mysql:
    image: mysql:8.0
    container_name: files_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_DATABASE}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER}", "-p${DB_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - files_network

  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: files_app
    restart: always
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      DB_HOST: mysql
    volumes:
      - ./public/upload:/usr/src/app/public/upload
    networks:
      - files_network

volumes:
  db_data:

networks:
  files_network:
    driver: bridge